name: Validate and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: validate-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Validate Gradle project
        run: gradle projects

      - name: Prepare signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in SIGNING_KEY ALIAS KEY_STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required repository secret: $var"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEY" | base64 -d > signingkey.jks
          chmod 600 signingkey.jks
          FINGERPRINT="$(keytool -list -v -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test -n "$FINGERPRINT"
          echo "SIGNING_KEY_PATH=$GITHUB_WORKSPACE/signingkey.jks" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"

      - name: Build extension APKs
        env:
          SIGNING_KEY_PATH: ${{ env.SIGNING_KEY_PATH }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          shopt -s nullglob
          modules=(src/*/*)
          if [ ${#modules[@]} -eq 0 ]; then
            echo "No extension modules yet; scaffold is valid."
            exit 0
          fi
          gradle assembleRelease

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aniyomi-extension-apks
          path: src/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Aniyomi repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(find src -type f -path '*/build/outputs/apk/release/*.apk' | sort)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "No APKs found to publish."
            exit 1
          fi

          git fetch origin repo
          git worktree add publish repo

          find publish -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          mkdir -p publish/apk

          for apk in "${APKS[@]}"; do
            cp "$apk" publish/apk/
          done

          python3 <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          EXTENSIONS = {
              "javenglish": {
                  "name": "Aniyomi: JAVEnglish",
                  "pkg": "eu.kanade.tachiyomi.animeextension.en.javenglish",
                  "version_prefix": "17",
                  "nsfw": 1,
                  "sources": [{
                      "name": "JAVEnglish",
                      "lang": "en",
                      "id": "1912024392600497429",
                      "baseUrl": "https://javenglish.cc",
                  }],
              },
              "javsubbed": {
                  "name": "Aniyomi: JAVSubbed",
                  "pkg": "eu.kanade.tachiyomi.animeextension.en.javsubbed",
                  "version_prefix": "17",
                  "nsfw": 1,
                  "sources": [{
                      "name": "JAVSubbed",
                      "lang": "en",
                      "id": "9192959167101688940",
                      "baseUrl": "https://javsubbed.net",
                  }],
              },
              "uncensoredreaders": {
                  "name": "Manga: Uncensored Readers",
                  "pkg": "eu.kanade.tachiyomi.extension.en.uncensoredreaders",
                  "version_prefix": "1.4",
                  "nsfw": 1,
                  "sources": [
                      {
                          "name": "Hasbic",
                          "lang": "en",
                          "id": "2844254863066184581",
                          "baseUrl": "https://hasbicmanhwa.com",
                      },
                      {
                          "name": "ToonCraze",
                          "lang": "en",
                          "id": "7661901217790392078",
                          "baseUrl": "https://tooncraze.com",
                      },
                      {
                          "name": "Yomowa",
                          "lang": "en",
                          "id": "7444097240594294135",
                          "baseUrl": "https://yomowa.com",
                      },
                      {
                          "name": "MangaHe",
                          "lang": "en",
                          "id": "1659239847291127359",
                          "baseUrl": "https://mangahe.com",
                      },
                      {
                          "name": "Manga Sin Censura",
                          "lang": "en",
                          "id": "5762561096423582212",
                          "baseUrl": "https://mangasincensura.com",
                      },
                  ],
              },
          }

          data = []
          for apk_file in sorted(Path("publish/apk").glob("*.apk")):
              lower = apk_file.name.lower()
              key = next((k for k in EXTENSIONS if k in lower), None)
              if not key:
                  raise SystemExit(f"Unknown APK filename: {apk_file.name}")

              meta = EXTENSIONS[key]
              gradle_file = Path("src/en") / key / "build.gradle"
              gradle_text = gradle_file.read_text(encoding="utf-8")
              match = re.search(r"extVersionCode\s*=\s*(\d+)", gradle_text)
              if not match:
                  raise SystemExit(f"Could not read extVersionCode from {gradle_file}")
              version_code = int(match.group(1))

              sources = [
                  {**source, "versionId": version_code}
                  for source in meta["sources"]
              ]

              data.append({
                  "name": meta["name"],
                  "pkg": meta["pkg"],
                  "apk": apk_file.name,
                  "lang": "en",
                  "code": version_code,
                  "version": f"{meta['version_prefix']}.{version_code}",
                  "nsfw": meta["nsfw"],
                  "hasReadme": 0,
                  "hasChangelog": 0,
                  "sources": sources,
                  "size": apk_file.stat().st_size,
                  "sha256": hashlib.sha256(apk_file.read_bytes()).hexdigest(),
              })

          Path("publish/index.json").write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          Path("publish/index.min.json").write_text(
              json.dumps(data, separators=(",", ":"), ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          import os

          fingerprint = os.environ["SIGNING_KEY_FINGERPRINT"]
          Path("publish/repo.json").write_text(
              json.dumps(
                  {
                      "meta": {
                          "name": "Aniyomi Extensions",
                          "shortName": "aniyomi-extensions",
                          "website": "https://github.com/MohammedEmad333/aniyomi-extensions",
                          "signingKeyFingerprint": fingerprint,
                      }
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

          cat > publish/README.md <<'EOF'
          # Aniyomi Extensions Repository

          Add this URL to Aniyomi:

          https://raw.githubusercontent.com/MohammedEmad333/aniyomi-extensions/repo/index.min.json
          EOF

          git -C publish config user.name "github-actions[bot]"
          git -C publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publish add -A
          git -C publish commit -m "Publish Aniyomi repository" || true
          git -C publish push origin repo

      - name: Remove signing key
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -f signingkey.jks

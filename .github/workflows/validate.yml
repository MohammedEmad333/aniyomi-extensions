name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Validate Gradle project
        run: gradle projects
      - name: Build extension APKs
        shell: bash
        run: |
          shopt -s nullglob
          modules=(src/*/*)
          if [ ${#modules[@]} -eq 0 ]; then
            echo "No extension modules yet; scaffold is valid."
            exit 0
          fi
          gradle assembleRelease
